name: Android CI/CD & Releases

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, Test & Package HighSpin
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest --no-daemon

    - name: Build Release & Debug APKs
      run: ./gradlew assembleRelease assembleDebug --no-daemon

    - name: Prepare Release Artifacts
      run: |
        mkdir -p release-artifacts
        cp app/build/outputs/apk/release/app-release.apk release-artifacts/HighSpin-release.apk
        cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/HighSpin-debug.apk
        cd release-artifacts
        sha256sum HighSpin-release.apk > HighSpin-release.apk.sha256
        sha256sum HighSpin-debug.apk > HighSpin-debug.apk.sha256

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: highspin-apks
        path: release-artifacts/*

    - name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-artifacts/HighSpin-release.apk
          release-artifacts/HighSpin-debug.apk
          release-artifacts/HighSpin-release.apk.sha256
          release-artifacts/HighSpin-debug.apk.sha256
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
